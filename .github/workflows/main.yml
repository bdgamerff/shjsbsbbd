name: Android CI/CD - Build & Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          echo "Starting IS VOICE FF Android Debug APK Build..."
          if [ -f "gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK Generation
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "SUCCESS: APK file verified at $APK_PATH"
            ls -lh "$APK_PATH"
            echo "apk_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: APK was not generated at expected location: $APK_PATH" >&2
            exit 1
          fi

      - name: Upload APK to GitHub Artifacts
        if: success() && steps.verify_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IS_VOICE_FF_Debug_APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Report Build Failure
        if: failure()
        run: |
          echo "::error title=Build Failed::Android APK compilation failed. Check the Gradle step log above for exact syntax or dependency details."
